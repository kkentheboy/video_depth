name: One-time conditional UI state mixin extraction

on:
  push:
    branches:
      - refactor/conditional-ui-state-mixin

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/conditional-ui-state-mixin
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract conditional UI state authority
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          ui_path = Path("app/depth_fusion_ui.py")
          ui = ui_path.read_text(encoding="utf-8")

          old_import = (
              "from components.input_source_state_mixin import InputSourceStateMixin\n"
              "from components.structure_cache_state_mixin import StructureCacheStateMixin\n"
          )
          new_import = (
              "from components.input_source_state_mixin import InputSourceStateMixin\n"
              "from components.conditional_ui_state_mixin import ConditionalUiStateMixin\n"
              "from components.structure_cache_state_mixin import StructureCacheStateMixin\n"
          )
          assert ui.count(old_import) == 1
          ui = ui.replace(old_import, new_import, 1)

          old_header = "class MainWindow(ResourceManagementMixin, FilePathActionsMixin, InputValidationMixin, InputSourceStateMixin, StructureCacheStateMixin, ModelConfigurationMixin, DeploymentEnvironmentMixin, ProcessingRangeMixin, PreviewFrameMixin, ProjectStateMixin, JobConfigurationMixin, OutputRoutingMixin, QMainWindow):"
          new_header = "class MainWindow(ResourceManagementMixin, FilePathActionsMixin, InputValidationMixin, InputSourceStateMixin, ConditionalUiStateMixin, StructureCacheStateMixin, ModelConfigurationMixin, DeploymentEnvironmentMixin, ProcessingRangeMixin, PreviewFrameMixin, ProjectStateMixin, JobConfigurationMixin, OutputRoutingMixin, QMainWindow):"
          assert ui.count(old_header) == 1
          ui = ui.replace(old_header, new_header, 1)

          start_token = "    def _on_density_mode_changed(self) -> None:\n"
          end_token = "    def pick_matting_model_path(self) -> None:\n"
          start = ui.index(start_token)
          end = ui.index(end_token, start)
          moved = ui[start:end]
          assert "    def _on_density_mode_changed(" in moved
          assert "    def _update_conditional_visibility(" in moved
          assert "    def _effective_pointcloud_stride(" not in moved
          assert "    def on_background_fill_changed(" not in moved
          ui_path.write_text(ui[:start] + ui[end:], encoding="utf-8")

          mixin_header = "# -*- coding: utf-8 -*-\nfrom __future__ import annotations\n\n\nclass ConditionalUiStateMixin:\n"
          Path("app/components/conditional_ui_state_mixin.py").write_text(mixin_header + moved, encoding="utf-8")

          contract = '''from __future__ import annotations

          import ast
          from pathlib import Path


          ROOT = Path(__file__).resolve().parents[1]
          UI_PATH = ROOT / "app" / "depth_fusion_ui.py"
          MIXIN_PATH = ROOT / "app" / "components" / "conditional_ui_state_mixin.py"
          INPUT_SOURCE_MIXIN_PATH = ROOT / "app" / "components" / "input_source_state_mixin.py"
          EXPECTED_METHODS = {"_on_density_mode_changed", "_update_conditional_visibility"}


          def parse(path: Path) -> ast.Module:
              return ast.parse(path.read_text(encoding="utf-8"), filename=str(path))


          def class_node(tree: ast.Module, name: str) -> ast.ClassDef:
              return next(node for node in tree.body if isinstance(node, ast.ClassDef) and node.name == name)


          def direct_methods(cls: ast.ClassDef) -> dict[str, ast.FunctionDef | ast.AsyncFunctionDef]:
              return {node.name: node for node in cls.body if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))}


          def self_calls(node: ast.AST) -> set[str]:
              calls: set[str] = set()
              for sub in ast.walk(node):
                  if not isinstance(sub, ast.Call):
                      continue
                  target = sub.func
                  if isinstance(target, ast.Attribute) and isinstance(target.value, ast.Name) and target.value.id == "self":
                      calls.add(target.attr)
              return calls


          def string_literals(node: ast.AST) -> set[str]:
              return {str(sub.value) for sub in ast.walk(node) if isinstance(sub, ast.Constant) and isinstance(sub.value, str)}


          def main() -> None:
              ui_cls = class_node(parse(UI_PATH), "MainWindow")
              mixin_cls = class_node(parse(MIXIN_PATH), "ConditionalUiStateMixin")
              input_source_cls = class_node(parse(INPUT_SOURCE_MIXIN_PATH), "InputSourceStateMixin")
              ui_methods = direct_methods(ui_cls)
              mixin_methods = direct_methods(mixin_cls)
              input_source_methods = direct_methods(input_source_cls)

              assert not (EXPECTED_METHODS - mixin_methods.keys())
              assert not (EXPECTED_METHODS & ui_methods.keys())
              assert "_effective_pointcloud_stride" in ui_methods, "unused/trivial stride query must not be moved just to enlarge this mixin"
              assert "on_background_fill_changed" in ui_methods, "preview-render action must remain on MainWindow"
              assert "depth_fusion_ui" not in MIXIN_PATH.read_text(encoding="utf-8")

              bases = [ast.unparse(base) for base in ui_cls.bases]
              assert bases.index("InputSourceStateMixin") < bases.index("ConditionalUiStateMixin") < bases.index("StructureCacheStateMixin")

              visibility = mixin_methods["_update_conditional_visibility"]
              visibility_calls = self_calls(visibility)
              assert {"_current_source_mode", "_on_density_mode_changed"} <= visibility_calls
              literals = string_literals(visibility)
              assert {"matanyone", "external_mask", "背景灰"} <= literals

              density = mixin_methods["_on_density_mode_changed"]
              density_literals = string_literals(density)
              assert {"pointcloud_stride_row", "pointcloud_max_points_row", "pointcloud_stride_spin", "pointcloud_max_points_spin"} <= density_literals

              source_sync_calls = self_calls(input_source_methods["_sync_source_mode_radios"])
              source_apply_calls = self_calls(input_source_methods["_apply_source_mode"])
              assert "_update_conditional_visibility" in source_sync_calls
              assert "_update_conditional_visibility" in source_apply_calls

              background_calls = self_calls(ui_methods["on_background_fill_changed"])
              assert {"_update_conditional_visibility", "_switch_to_fusion_preview_for_curve_edit", "render_preview_from_cache"} <= background_calls

              print("conditional UI state mixin contract: PASS")


          if __name__ == "__main__":
              main()
          '''
          Path("scripts/regression_conditional_ui_state_mixin.py").write_text(textwrap.dedent(contract), encoding="utf-8")
          PY
      - name: Validate affected source contract
        shell: bash
        run: |
          python -m compileall -q app scripts/regression_conditional_ui_state_mixin.py
          python scripts/regression_input_source_state_mixin.py
          python scripts/regression_conditional_ui_state_mixin.py
          git diff --check
      - name: Commit extracted authority
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/depth_fusion_ui.py app/components/conditional_ui_state_mixin.py scripts/regression_conditional_ui_state_mixin.py
          git commit -m "refactor: extract conditional UI state mixin"
          git push origin HEAD:refactor/conditional-ui-state-mixin
