name: One-time input source state mixin extraction

on:
  push:
    branches:
      - refactor/input-source-state-mixin

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/input-source-state-mixin
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract cohesive input-source UI state authority
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          ui_path = Path("app/depth_fusion_ui.py")
          ui = ui_path.read_text(encoding="utf-8")

          old_import = (
              "from components.input_validation_mixin import InputValidationMixin\n"
              "from components.structure_cache_state_mixin import StructureCacheStateMixin\n"
          )
          new_import = (
              "from components.input_validation_mixin import InputValidationMixin\n"
              "from components.input_source_state_mixin import InputSourceStateMixin\n"
              "from components.structure_cache_state_mixin import StructureCacheStateMixin\n"
          )
          assert ui.count(old_import) == 1, "expected input-validation/structure-cache import adjacency changed"
          ui = ui.replace(old_import, new_import, 1)

          old_header = "class MainWindow(ResourceManagementMixin, FilePathActionsMixin, InputValidationMixin, StructureCacheStateMixin, ModelConfigurationMixin, DeploymentEnvironmentMixin, ProcessingRangeMixin, PreviewFrameMixin, ProjectStateMixin, JobConfigurationMixin, OutputRoutingMixin, QMainWindow):"
          new_header = "class MainWindow(ResourceManagementMixin, FilePathActionsMixin, InputValidationMixin, InputSourceStateMixin, StructureCacheStateMixin, ModelConfigurationMixin, DeploymentEnvironmentMixin, ProcessingRangeMixin, PreviewFrameMixin, ProjectStateMixin, JobConfigurationMixin, OutputRoutingMixin, QMainWindow):"
          assert ui.count(old_header) == 1, "MainWindow base list changed"
          ui = ui.replace(old_header, new_header, 1)

          start_token = "    def on_matting_controls_changed(self) -> None:\n"
          end_token = "    def _effective_pointcloud_stride(self) -> int:\n"
          start = ui.index(start_token)
          end = ui.index(end_token, start)
          moved = ui[start:end]
          expected = {
              "on_matting_controls_changed",
              "_update_matting_status_label",
              "_source_mode_from_current_controls",
              "_current_source_mode",
              "_sync_source_mode_radios",
              "_apply_source_mode",
          }
          for name in expected:
              assert f"    def {name}(" in moved, f"missing expected source-state method: {name}"
          assert "    def _update_conditional_visibility(" not in moved, "generic conditional visibility must stay on MainWindow"
          ui = ui[:start] + ui[end:]
          ui_path.write_text(ui, encoding="utf-8")

          mixin = '''# -*- coding: utf-8 -*-
          from __future__ import annotations


          class InputSourceStateMixin:
              def on_matting_controls_changed(self) -> None:
                  pass

              def _update_matting_status_label(self) -> None:
                  pass

              def _source_mode_from_current_controls(self) -> str:
                  """The structure-XYZ workflow uses the alpha channel embedded in the main video."""
                  return "cutout_video"

              def _current_source_mode(self) -> str:
                  return "cutout_video"

              def _sync_source_mode_radios(self) -> None:
                  if not hasattr(self, "source_cutout_radio"):
                      return
                  for radio in (self.source_cutout_radio, self.source_matanyone_radio, self.source_external_mask_radio):
                      radio.blockSignals(True)
                      radio.setChecked(radio is self.source_cutout_radio)
                      radio.blockSignals(False)
                  self._update_conditional_visibility()

              def _apply_source_mode(self, mode: str) -> None:
                  """Force the single-input workflow: main video alpha only."""
                  for widget, checked in (
                      (self.input_cutout_mask_check, True),
                  ):
                      widget.blockSignals(True)
                      widget.setChecked(bool(checked))
                      widget.blockSignals(False)
                  self._sync_source_mode_radios()
                  self._update_matting_status_label()
                  self._update_conditional_visibility()
                  self.on_external_media_changed()
          '''
          import textwrap
          Path("app/components/input_source_state_mixin.py").write_text(textwrap.dedent(mixin), encoding="utf-8")

          contract = '''from __future__ import annotations

          import ast
          from pathlib import Path


          ROOT = Path(__file__).resolve().parents[1]
          UI_PATH = ROOT / "app" / "depth_fusion_ui.py"
          MIXIN_PATH = ROOT / "app" / "components" / "input_source_state_mixin.py"

          EXPECTED_METHODS = {
              "on_matting_controls_changed",
              "_update_matting_status_label",
              "_source_mode_from_current_controls",
              "_current_source_mode",
              "_sync_source_mode_radios",
              "_apply_source_mode",
          }


          def parse(path: Path) -> ast.Module:
              return ast.parse(path.read_text(encoding="utf-8"), filename=str(path))


          def class_node(tree: ast.Module, name: str) -> ast.ClassDef:
              return next(node for node in tree.body if isinstance(node, ast.ClassDef) and node.name == name)


          def direct_methods(cls: ast.ClassDef) -> dict[str, ast.FunctionDef | ast.AsyncFunctionDef]:
              return {
                  node.name: node
                  for node in cls.body
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
              }


          def self_calls(node: ast.AST) -> set[str]:
              calls: set[str] = set()
              for sub in ast.walk(node):
                  if not isinstance(sub, ast.Call):
                      continue
                  target = sub.func
                  if isinstance(target, ast.Attribute) and isinstance(target.value, ast.Name) and target.value.id == "self":
                      calls.add(target.attr)
              return calls


          def constant_return(node: ast.FunctionDef | ast.AsyncFunctionDef) -> str | None:
              returns = [sub for sub in ast.walk(node) if isinstance(sub, ast.Return)]
              if len(returns) != 1 or not isinstance(returns[0].value, ast.Constant):
                  return None
              value = returns[0].value.value
              return value if isinstance(value, str) else None


          def is_pass_stub(node: ast.FunctionDef | ast.AsyncFunctionDef) -> bool:
              body = list(node.body)
              return len(body) == 1 and isinstance(body[0], ast.Pass)


          def main() -> None:
              ui_tree = parse(UI_PATH)
              mixin_tree = parse(MIXIN_PATH)
              ui_cls = class_node(ui_tree, "MainWindow")
              mixin_cls = class_node(mixin_tree, "InputSourceStateMixin")
              ui_methods = direct_methods(ui_cls)
              mixin_methods = direct_methods(mixin_cls)

              missing = EXPECTED_METHODS - mixin_methods.keys()
              assert not missing, f"InputSourceStateMixin missing methods: {sorted(missing)}"
              leaked = EXPECTED_METHODS & ui_methods.keys()
              assert not leaked, f"input-source state methods returned to MainWindow: {sorted(leaked)}"
              assert "_update_conditional_visibility" in ui_methods, "generic conditional visibility must remain on MainWindow"
              assert "_update_conditional_visibility" not in mixin_methods, "InputSourceStateMixin must not absorb unrelated visibility policy"

              source = MIXIN_PATH.read_text(encoding="utf-8")
              assert "depth_fusion_ui" not in source, "InputSourceStateMixin must not reverse-import depth_fusion_ui"

              bases = [ast.unparse(base) for base in ui_cls.bases]
              assert "InputSourceStateMixin" in bases
              assert bases.index("InputValidationMixin") < bases.index("InputSourceStateMixin") < bases.index("StructureCacheStateMixin"), (
                  "InputSourceStateMixin must sit between input validation and structure cache state"
              )

              assert is_pass_stub(mixin_methods["on_matting_controls_changed"]), "matting change stub behavior must remain pass-only"
              assert is_pass_stub(mixin_methods["_update_matting_status_label"]), "matting status stub behavior must remain pass-only"
              assert constant_return(mixin_methods["_source_mode_from_current_controls"]) == "cutout_video", (
                  "source mode control query must preserve fixed cutout_video behavior"
              )
              assert constant_return(mixin_methods["_current_source_mode"]) == "cutout_video", (
                  "current source mode must preserve fixed cutout_video behavior"
              )

              sync_calls = self_calls(mixin_methods["_sync_source_mode_radios"])
              assert "_update_conditional_visibility" in sync_calls
              apply_calls = self_calls(mixin_methods["_apply_source_mode"])
              assert {
                  "_sync_source_mode_radios",
                  "_update_matting_status_label",
                  "_update_conditional_visibility",
                  "on_external_media_changed",
              } <= apply_calls

              assert "_update_three_model_status" in ui_methods
              assert "_update_matting_status_label" in self_calls(ui_methods["_update_three_model_status"]), (
                  "MainWindow status orchestration must delegate matting status to InputSourceStateMixin"
              )
              visibility_calls = self_calls(ui_methods["_update_conditional_visibility"])
              assert "_current_source_mode" in visibility_calls or "_source_mode_from_current_controls" in visibility_calls, (
                  "generic conditional visibility must query source mode through InputSourceStateMixin"
              )

              print("input source state mixin contract: PASS")


          if __name__ == "__main__":
              main()
          '''
          Path("scripts/regression_input_source_state_mixin.py").write_text(textwrap.dedent(contract), encoding="utf-8")

          gate_path = Path(".github/workflows/source-core-gate.yml")
          gate = gate_path.read_text(encoding="utf-8")
          compile_old = "scripts/regression_structure_cache_state_mixin.py"
          compile_new = "scripts/regression_structure_cache_state_mixin.py scripts/regression_input_source_state_mixin.py"
          assert gate.count(compile_old) >= 1, "structure cache contract missing from Source Core Gate"
          gate = gate.replace(compile_old, compile_new, 1)
          step = '''

                - name: Verify input source state mixin contract
                  run: python scripts/regression_input_source_state_mixin.py
          '''
          assert "Verify input source state mixin contract" not in gate
          gate = gate.rstrip() + textwrap.dedent(step)
          gate_path.write_text(gate, encoding="utf-8")

          Path(".github/workflows/_temp_input_source_state_refactor.yml").unlink()
          PY
      - name: Validate affected source contract
        shell: bash
        run: |
          python -m compileall -q app scripts/regression_input_source_state_mixin.py
          python scripts/regression_input_source_state_mixin.py
          git diff --check
      - name: Commit extracted authority
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/depth_fusion_ui.py app/components/input_source_state_mixin.py scripts/regression_input_source_state_mixin.py .github/workflows/source-core-gate.yml .github/workflows/_temp_input_source_state_refactor.yml
          git commit -m "refactor: extract input source state UI mixin"
          git push origin HEAD:refactor/input-source-state-mixin
