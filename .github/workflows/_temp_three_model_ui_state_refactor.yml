name: One-time three-model UI state mixin extraction

on:
  push:
    branches:
      - refactor/three-model-ui-state-mixin

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/three-model-ui-state-mixin
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract three-model UI state authority
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          ui_path = Path("app/depth_fusion_ui.py")
          ui = ui_path.read_text(encoding="utf-8")

          old_import = (
              "from components.conditional_ui_state_mixin import ConditionalUiStateMixin\n"
              "from components.structure_cache_state_mixin import StructureCacheStateMixin\n"
          )
          new_import = (
              "from components.conditional_ui_state_mixin import ConditionalUiStateMixin\n"
              "from components.three_model_ui_state_mixin import ThreeModelUiStateMixin\n"
              "from components.structure_cache_state_mixin import StructureCacheStateMixin\n"
          )
          assert ui.count(old_import) == 1
          ui = ui.replace(old_import, new_import, 1)

          old_header = "class MainWindow(ResourceManagementMixin, FilePathActionsMixin, InputValidationMixin, InputSourceStateMixin, ConditionalUiStateMixin, StructureCacheStateMixin, ModelConfigurationMixin, DeploymentEnvironmentMixin, ProcessingRangeMixin, PreviewFrameMixin, ProjectStateMixin, JobConfigurationMixin, OutputRoutingMixin, QMainWindow):"
          new_header = "class MainWindow(ResourceManagementMixin, FilePathActionsMixin, InputValidationMixin, InputSourceStateMixin, ConditionalUiStateMixin, ThreeModelUiStateMixin, StructureCacheStateMixin, ModelConfigurationMixin, DeploymentEnvironmentMixin, ProcessingRangeMixin, PreviewFrameMixin, ProjectStateMixin, JobConfigurationMixin, OutputRoutingMixin, QMainWindow):"
          assert ui.count(old_header) == 1
          ui = ui.replace(old_header, new_header, 1)

          q_start = ui.index("    def _effective_normal_strength(self) -> int:\n")
          q_end = ui.index("    def on_three_model_controls_changed(self) -> None:\n", q_start)
          query_block = ui[q_start:q_end]
          assert "    def _effective_normal_strength(" in query_block
          assert "    def _effective_normal_refine(" in query_block

          s_start = ui.index("    def _update_three_model_status(self) -> None:\n", q_end)
          s_end = ui.index("    def _effective_pointcloud_stride(self) -> int:\n", s_start)
          status_block = ui[s_start:s_end]
          assert "    def on_three_model_controls_changed(" not in status_block
          assert "    def _update_three_model_status(" in status_block

          ui = ui[:s_start] + ui[s_end:]
          q_start = ui.index("    def _effective_normal_strength(self) -> int:\n")
          q_end = ui.index("    def on_three_model_controls_changed(self) -> None:\n", q_start)
          ui = ui[:q_start] + ui[q_end:]
          ui_path.write_text(ui, encoding="utf-8")

          mixin_header = "# -*- coding: utf-8 -*-\nfrom __future__ import annotations\n\n\nclass ThreeModelUiStateMixin:\n"
          Path("app/components/three_model_ui_state_mixin.py").write_text(mixin_header + query_block + status_block, encoding="utf-8")

          input_contract_path = Path("scripts/regression_input_source_state_mixin.py")
          input_contract = input_contract_path.read_text(encoding="utf-8")
          stale = '    assert "_update_matting_status_label" in self_calls(ui_methods["_update_three_model_status"])\n'
          assert input_contract.count(stale) == 1, "input-source cross-authority assertion changed"
          input_contract_path.write_text(input_contract.replace(stale, "", 1), encoding="utf-8")

          contract = '''from __future__ import annotations

          import ast
          from pathlib import Path


          ROOT = Path(__file__).resolve().parents[1]
          UI_PATH = ROOT / "app" / "depth_fusion_ui.py"
          MIXIN_PATH = ROOT / "app" / "components" / "three_model_ui_state_mixin.py"
          EXPECTED_METHODS = {"_effective_normal_strength", "_effective_normal_refine", "_update_three_model_status"}


          def parse(path: Path) -> ast.Module:
              return ast.parse(path.read_text(encoding="utf-8"), filename=str(path))


          def class_node(tree: ast.Module, name: str) -> ast.ClassDef:
              return next(node for node in tree.body if isinstance(node, ast.ClassDef) and node.name == name)


          def direct_methods(cls: ast.ClassDef) -> dict[str, ast.FunctionDef | ast.AsyncFunctionDef]:
              return {node.name: node for node in cls.body if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))}


          def self_calls(node: ast.AST) -> set[str]:
              calls: set[str] = set()
              for sub in ast.walk(node):
                  if not isinstance(sub, ast.Call):
                      continue
                  target = sub.func
                  if isinstance(target, ast.Attribute) and isinstance(target.value, ast.Name) and target.value.id == "self":
                      calls.add(target.attr)
              return calls


          def constant_return(node: ast.FunctionDef | ast.AsyncFunctionDef) -> object:
              returns = [sub for sub in ast.walk(node) if isinstance(sub, ast.Return)]
              if len(returns) != 1 or not isinstance(returns[0].value, ast.Constant):
                  return object()
              return returns[0].value.value


          def main() -> None:
              ui_cls = class_node(parse(UI_PATH), "MainWindow")
              mixin_cls = class_node(parse(MIXIN_PATH), "ThreeModelUiStateMixin")
              ui_methods = direct_methods(ui_cls)
              mixin_methods = direct_methods(mixin_cls)

              assert not (EXPECTED_METHODS - mixin_methods.keys())
              assert not (EXPECTED_METHODS & ui_methods.keys())
              assert "on_three_model_controls_changed" in ui_methods, "preview/cache/render action must remain on MainWindow"
              assert "_effective_pointcloud_stride" in ui_methods, "unrelated pointcloud query must remain on MainWindow"
              assert "depth_fusion_ui" not in MIXIN_PATH.read_text(encoding="utf-8")

              bases = [ast.unparse(base) for base in ui_cls.bases]
              assert bases.index("ConditionalUiStateMixin") < bases.index("ThreeModelUiStateMixin") < bases.index("StructureCacheStateMixin")

              assert constant_return(mixin_methods["_effective_normal_strength"]) == 0
              assert constant_return(mixin_methods["_effective_normal_refine"]) == 0

              status_calls = self_calls(mixin_methods["_update_three_model_status"])
              assert {"_update_matting_status_label", "_update_external_media_status_label", "refresh_3d_model_status"} <= status_calls

              action_calls = self_calls(ui_methods["on_three_model_controls_changed"])
              assert {"_update_three_model_status", "_effective_normal_strength", "_effective_normal_refine", "render_preview_from_cache"} <= action_calls

              source = ast.get_source_segment(MIXIN_PATH.read_text(encoding="utf-8"), mixin_methods["_update_three_model_status"]) or ""
              assert "4DHumans" in source
              assert "Root稳定/时序去抖" in source
              assert "setEnabled(False)" in source

              print("three-model UI state mixin contract: PASS")


          if __name__ == "__main__":
              main()
          '''
          Path("scripts/regression_three_model_ui_state_mixin.py").write_text(textwrap.dedent(contract), encoding="utf-8")
          PY
      - name: Validate affected source contract
        shell: bash
        run: |
          python -m compileall -q app scripts/regression_three_model_ui_state_mixin.py
          python scripts/regression_input_source_state_mixin.py
          python scripts/regression_conditional_ui_state_mixin.py
          python scripts/regression_three_model_ui_state_mixin.py
          git diff --check
      - name: Commit extracted authority
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/depth_fusion_ui.py app/components/three_model_ui_state_mixin.py scripts/regression_three_model_ui_state_mixin.py scripts/regression_input_source_state_mixin.py
          git commit -m "refactor: extract three-model UI state mixin"
          git push origin HEAD:refactor/three-model-ui-state-mixin
