name: One-time UI presentation state mixin extraction

on:
  push:
    branches:
      - refactor/ui-presentation-state-mixin

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/ui-presentation-state-mixin
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract UI presentation state authority
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          ui_path = Path("app/depth_fusion_ui.py")
          ui = ui_path.read_text(encoding="utf-8")

          old_import = (
              "from components.three_model_ui_state_mixin import ThreeModelUiStateMixin\n"
              "from components.structure_cache_state_mixin import StructureCacheStateMixin\n"
          )
          new_import = (
              "from components.three_model_ui_state_mixin import ThreeModelUiStateMixin\n"
              "from components.ui_presentation_state_mixin import UiPresentationStateMixin\n"
              "from components.structure_cache_state_mixin import StructureCacheStateMixin\n"
          )
          assert ui.count(old_import) == 1
          ui = ui.replace(old_import, new_import, 1)

          old_header = "class MainWindow(ResourceManagementMixin, FilePathActionsMixin, InputValidationMixin, InputSourceStateMixin, ConditionalUiStateMixin, ThreeModelUiStateMixin, StructureCacheStateMixin, ModelConfigurationMixin, DeploymentEnvironmentMixin, ProcessingRangeMixin, PreviewFrameMixin, ProjectStateMixin, JobConfigurationMixin, OutputRoutingMixin, QMainWindow):"
          new_header = "class MainWindow(ResourceManagementMixin, FilePathActionsMixin, InputValidationMixin, InputSourceStateMixin, ConditionalUiStateMixin, ThreeModelUiStateMixin, UiPresentationStateMixin, StructureCacheStateMixin, ModelConfigurationMixin, DeploymentEnvironmentMixin, ProcessingRangeMixin, PreviewFrameMixin, ProjectStateMixin, JobConfigurationMixin, OutputRoutingMixin, QMainWindow):"
          assert ui.count(old_header) == 1
          ui = ui.replace(old_header, new_header, 1)

          block1_start = ui.index("    def _apply_style(self) -> None:\n")
          block1_end = ui.index("    def eventFilter(self, obj, event) -> bool:", block1_start)
          block1 = ui[block1_start:block1_end]
          assert "    def _apply_style(" in block1
          assert "    def _install_button_cursor_policy(" in block1
          assert "    def _sync_button_cursor(" in block1
          assert "    def eventFilter(" not in block1
          ui = ui[:block1_start] + ui[block1_end:]

          block2_start = ui.index("    def _refresh_widget_style(self, widget: QWidget) -> None:\n")
          block2_end = ui.index("    def _append_event_console_line(self, text: str) -> None:\n", block2_start)
          block2 = ui[block2_start:block2_end]
          assert "    def _refresh_widget_style(" in block2
          assert "    def _set_depth_preview_busy(" in block2
          assert "    def _append_event_console_line(" not in block2
          ui = ui[:block2_start] + ui[block2_end:]
          ui_path.write_text(ui, encoding="utf-8")

          mixin_header = '''# -*- coding: utf-8 -*-
          from __future__ import annotations

          from depth_fusion_core import APP_STYLESHEET, QCursor, QPushButton, QWidget, Qt


          class UiPresentationStateMixin:
          '''
          Path("app/components/ui_presentation_state_mixin.py").write_text(
              textwrap.dedent(mixin_header) + block1 + block2,
              encoding="utf-8",
          )

          contract = '''from __future__ import annotations

          import ast
          from pathlib import Path


          ROOT = Path(__file__).resolve().parents[1]
          UI_PATH = ROOT / "app" / "depth_fusion_ui.py"
          MIXIN_PATH = ROOT / "app" / "components" / "ui_presentation_state_mixin.py"
          EXPECTED_METHODS = {
              "_apply_style",
              "_install_button_cursor_policy",
              "_sync_button_cursor",
              "_refresh_widget_style",
              "_set_depth_preview_busy",
          }


          def parse(path: Path) -> ast.Module:
              return ast.parse(path.read_text(encoding="utf-8"), filename=str(path))


          def class_node(tree: ast.Module, name: str) -> ast.ClassDef:
              return next(node for node in tree.body if isinstance(node, ast.ClassDef) and node.name == name)


          def direct_methods(cls: ast.ClassDef) -> dict[str, ast.FunctionDef | ast.AsyncFunctionDef]:
              return {node.name: node for node in cls.body if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))}


          def self_calls(node: ast.AST) -> set[str]:
              calls: set[str] = set()
              for sub in ast.walk(node):
                  if not isinstance(sub, ast.Call):
                      continue
                  target = sub.func
                  if isinstance(target, ast.Attribute) and isinstance(target.value, ast.Name) and target.value.id == "self":
                      calls.add(target.attr)
              return calls


          def string_literals(node: ast.AST) -> set[str]:
              return {str(sub.value) for sub in ast.walk(node) if isinstance(sub, ast.Constant) and isinstance(sub.value, str)}


          def main() -> None:
              ui_cls = class_node(parse(UI_PATH), "MainWindow")
              mixin_cls = class_node(parse(MIXIN_PATH), "UiPresentationStateMixin")
              ui_methods = direct_methods(ui_cls)
              mixin_methods = direct_methods(mixin_cls)

              assert not (EXPECTED_METHODS - mixin_methods.keys())
              assert not (EXPECTED_METHODS & ui_methods.keys())
              assert "eventFilter" in ui_methods, "Qt event-dispatch integration must remain on MainWindow"
              assert "_append_event_console_line" in ui_methods, "event console integration is not presentation-state ownership"
              assert "depth_fusion_ui" not in MIXIN_PATH.read_text(encoding="utf-8")

              bases = [ast.unparse(base) for base in ui_cls.bases]
              assert bases.index("ThreeModelUiStateMixin") < bases.index("UiPresentationStateMixin") < bases.index("StructureCacheStateMixin")

              apply_calls = self_calls(mixin_methods["_apply_style"])
              assert {"setStyleSheet", "_install_button_cursor_policy"} <= apply_calls
              apply_literals = string_literals(mixin_methods["_apply_style"])
              assert {"secondaryAction", "pathEdit", "previewStatusLabel", "infoLabel"} <= apply_literals

              cursor_calls = self_calls(mixin_methods["_install_button_cursor_policy"])
              assert {"findChildren", "_sync_button_cursor"} <= cursor_calls
              sync_literals = string_literals(mixin_methods["_set_depth_preview_busy"])
              assert {"计算中...", "busy", "1", "0"} <= sync_literals
              assert "_refresh_widget_style" in self_calls(mixin_methods["_set_depth_preview_busy"])

              event_calls = self_calls(ui_methods["eventFilter"])
              assert "_sync_button_cursor" in event_calls

              print("UI presentation state mixin contract: PASS")


          if __name__ == "__main__":
              main()
          '''
          Path("scripts/regression_ui_presentation_state_mixin.py").write_text(textwrap.dedent(contract), encoding="utf-8")
          PY
      - name: Validate affected source contract
        shell: bash
        run: |
          python -m compileall -q app scripts/regression_ui_presentation_state_mixin.py
          python scripts/regression_ui_primitive_authority.py
          python scripts/regression_ui_presentation_state_mixin.py
          git diff --check
      - name: Commit extracted authority
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/depth_fusion_ui.py app/components/ui_presentation_state_mixin.py scripts/regression_ui_presentation_state_mixin.py
          git commit -m "refactor: extract UI presentation state mixin"
          git push origin HEAD:refactor/ui-presentation-state-mixin
