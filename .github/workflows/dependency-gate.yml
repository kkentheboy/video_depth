name: Dependency Gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  numeric-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        numpy-version: ['1.26.4', '2.2.6']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install numeric stack
        run: >-
          python -m pip install --disable-pip-version-check
          "numpy==${{ matrix.numpy-version }}"
          "opencv-python>=4.10,<5"
          "Pillow>=11,<13"
          "scipy>=1.14,<2"

      - name: Verify numeric ABI imports
        run: python -c "import numpy, cv2, scipy, PIL; print('numeric stack:', numpy.__version__, cv2.__version__, scipy.__version__)"

      - name: Verify numeric resolver consistency
        run: python -m pip check

  declared-base-environment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install declared base environment
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Verify resolver consistency
        run: python -m pip check

      - name: Verify dependency imports
        run: python scripts/verify_environment.py
