name: Extract Deployment Environment Mixin Temp

on:
  push:
    branches: [refactor/extract-deployment-environment-mixin-20260906]

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-deployment-environment-mixin-20260906
          fetch-depth: 0
      - name: Extract deployment environment mixin
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import ast
          import symtable
          from pathlib import Path

          ui_path = Path('app/depth_fusion_ui.py')
          out_path = Path('app/components/deployment_environment_mixin.py')
          source = ui_path.read_text(encoding='utf-8')
          tree = ast.parse(source)
          main = next(n for n in tree.body if isinstance(n, ast.ClassDef) and n.name == 'MainWindow')
          methods = {n.name: n for n in main.body if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef))}
          selected = {
              '_pip_package_for_module',
              '_deployment_missing_python_modules',
              '_deployment_model_resource_note',
              '_format_deployment_environment_lines',
              'refresh_deployment_environment_status',
          }
          missing = sorted(selected - methods.keys())
          assert not missing, f'missing deployment environment methods: {missing}'

          moved_nodes = [n for n in main.body if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef)) and n.name in selected]
          assert len(moved_nodes) == len(selected)
          lines = source.splitlines(keepends=True)
          node_start = lambda n: min([n.lineno] + [d.lineno for d in n.decorator_list]) - 1
          moved_src = {n.name: ''.join(lines[node_start(n):n.end_lineno]).rstrip() + '\n' for n in moved_nodes}

          # Resolve runtime global names from each moved function and all nested scopes.
          builtin_names = set(dir(__builtins__))
          top_st = symtable.symtable(source, str(ui_path), 'exec')
          main_st = next(ch for ch in top_st.get_children() if ch.get_name() == 'MainWindow')
          fn_tables = {ch.get_name(): ch for ch in main_st.get_children() if ch.get_name() in selected}

          def collect_globals(table):
              out = set()
              for ident in table.get_identifiers():
                  sym = table.lookup(ident)
                  if sym.is_global() and ident not in builtin_names:
                      out.add(ident)
              for child in table.get_children():
                  out |= collect_globals(child)
              return out

          loaded = set()
          for node in moved_nodes:
              for sub in ast.walk(node):
                  if isinstance(sub, ast.Name) and isinstance(sub.ctx, ast.Load):
                      loaded.add(sub.id)
          global_names = set()
          for name in selected:
              global_names |= collect_globals(fn_tables[name])
          global_names &= loaded

          bound_to_node = {}
          for node in tree.body:
              if isinstance(node, ast.Import):
                  for alias in node.names:
                      bound_to_node[alias.asname or alias.name.split('.')[0]] = node
              elif isinstance(node, ast.ImportFrom):
                  for alias in node.names:
                      bound_to_node[alias.asname or alias.name] = node
          missing_globals = sorted(n for n in global_names if n not in bound_to_node)
          assert not missing_globals, f'moved methods depend on UI-local globals: {missing_globals}'

          import_lines = []
          plain = []
          from_groups = {}
          for name in sorted(global_names):
              node = bound_to_node[name]
              if isinstance(node, ast.Import):
                  alias = next(a for a in node.names if (a.asname or a.name.split('.')[0]) == name)
                  plain.append(alias)
              else:
                  key = (node.module, node.level)
                  alias = next(a for a in node.names if (a.asname or a.name) == name)
                  from_groups.setdefault(key, []).append(alias)
          for a in plain:
              import_lines.append('import ' + a.name + (f' as {a.asname}' if a.asname else ''))
          for (module, level), aliases in sorted(from_groups.items(), key=lambda kv: ((kv[0][0] or ''), kv[0][1])):
              prefix = '.' * level + (module or '')
              specs = ', '.join(a.name + (f' as {a.asname}' if a.asname else '') for a in sorted(aliases, key=lambda a: a.asname or a.name))
              import_lines.append(f'from {prefix} import {specs}')

          body = '# -*- coding: utf-8 -*-\nfrom __future__ import annotations\n\n'
          if import_lines:
              body += '\n'.join(import_lines) + '\n\n'
          body += 'class DeploymentEnvironmentMixin:\n'
          for node in moved_nodes:
              body += moved_src[node.name] + '\n'
          out_path.write_text(body.rstrip() + '\n', encoding='utf-8')

          new_lines = lines[:]
          for start, end in sorted(((node_start(n), n.end_lineno) for n in moved_nodes), reverse=True):
              del new_lines[start:end]
          new_source = ''.join(new_lines)
          import_anchor = 'from components.model_configuration_mixin import ModelConfigurationMixin\n'
          assert new_source.count(import_anchor) == 1
          new_source = new_source.replace(import_anchor, import_anchor + 'from components.deployment_environment_mixin import DeploymentEnvironmentMixin\n')
          old_class = 'class MainWindow(ResourceManagementMixin, FilePathActionsMixin, InputValidationMixin, ModelConfigurationMixin, ProcessingRangeMixin, PreviewFrameMixin, ProjectStateMixin, JobConfigurationMixin, OutputRoutingMixin, QMainWindow):'
          new_class = 'class MainWindow(ResourceManagementMixin, FilePathActionsMixin, InputValidationMixin, ModelConfigurationMixin, DeploymentEnvironmentMixin, ProcessingRangeMixin, PreviewFrameMixin, ProjectStateMixin, JobConfigurationMixin, OutputRoutingMixin, QMainWindow):'
          assert new_source.count(old_class) == 1
          ui_path.write_text(new_source.replace(old_class, new_class), encoding='utf-8')

          new_tree = ast.parse(out_path.read_text(encoding='utf-8'))
          mixin = next(n for n in new_tree.body if isinstance(n, ast.ClassDef) and n.name == 'DeploymentEnvironmentMixin')
          new_methods = {n.name: n for n in mixin.body if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef))}
          for name in selected:
              assert ast.dump(methods[name], include_attributes=False) == ast.dump(new_methods[name], include_attributes=False), f'AST changed for {name}'

          remaining_tree = ast.parse(ui_path.read_text(encoding='utf-8'))
          remaining_main = next(n for n in remaining_tree.body if isinstance(n, ast.ClassDef) and n.name == 'MainWindow')
          remaining_names = {n.name for n in remaining_main.body if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef))}
          assert not (selected & remaining_names), f'deployment status methods remain in MainWindow: {sorted(selected & remaining_names)}'
          assert 'depth_fusion_ui' not in out_path.read_text(encoding='utf-8')

          # Explicitly keep side-effect actions in MainWindow.
          assert 'install_deployment_python_dependencies' in remaining_names
          assert '_download_fashn_human_parser_model' in remaining_names
          PY
          python -m compileall -q app
      - name: Commit extraction and self-delete
        shell: bash
        run: |
          rm .github/workflows/extract-deployment-environment-mixin-temp.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/depth_fusion_ui.py app/components/deployment_environment_mixin.py .github/workflows/extract-deployment-environment-mixin-temp.yml
          git commit -m "refactor: extract deployment environment mixin"
          git push origin HEAD:refactor/extract-deployment-environment-mixin-20260906
