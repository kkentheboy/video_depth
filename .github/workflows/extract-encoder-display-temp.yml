name: Extract Encoder Display Temp

on:
  push:
    branches: [refactor/extract-encoder-display-20260905]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-encoder-display-20260905
          fetch-depth: 0
      - name: Replace exact UI mapping block and self-delete
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('app/depth_fusion_ui.py')
          text = path.read_text(encoding='utf-8')
          old = '''ENCODER_MODE_DISPLAY: dict[str, str] = {
              "FFmpeg H.264": "黑白 MP4",
              "FFmpeg H.264 10-bit": "黑白 MP4 10-bit",
              "FFmpeg H.265 10-bit": "黑白 H.265 10-bit",
              "FFmpeg H.264 NVENC": "黑白 MP4 NVENC",
              "OpenCV mp4v": "兼容 MP4",
              "PNG序列 16-bit": "16bit PNG 序列",
          }
          ENCODER_DISPLAY_MODE: dict[str, str] = {display: mode for mode, display in ENCODER_MODE_DISPLAY.items()}


          def encoder_display_name(mode: str) -> str:
              return ENCODER_MODE_DISPLAY.get(str(mode), str(mode))


          def encoder_internal_name(display_or_mode: str) -> str:
              text = str(display_or_mode)
              return ENCODER_DISPLAY_MODE.get(text, text)


          '''
          # The literal above is indented by the workflow's Python heredoc indentation.
          old = ''.join(line[10:] if line.startswith('          ') else line for line in old.splitlines(keepends=True))
          new = 'from common.encoder_display import encoder_display_name, encoder_internal_name\n\n\n'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one encoder mapping block, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python -m compileall -q app/depth_fusion_ui.py app/common/encoder_display.py scripts/regression_encoder_display_contract.py
          python scripts/regression_encoder_display_contract.py
          rm .github/workflows/extract-encoder-display-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: use common encoder display mapping"
          git push origin HEAD:refactor/extract-encoder-display-20260905
