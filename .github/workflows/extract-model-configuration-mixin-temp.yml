name: Extract Model Configuration Mixin Temp

on:
  push:
    branches: [refactor/extract-model-configuration-mixin-20260906]

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-model-configuration-mixin-20260906
          fetch-depth: 0
      - name: Extract model configuration mixin
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import ast
          import re
          import symtable
          from pathlib import Path

          ui_path = Path('app/depth_fusion_ui.py')
          out_path = Path('app/components/model_configuration_mixin.py')
          source = ui_path.read_text(encoding='utf-8')
          tree = ast.parse(source)
          main = next(n for n in tree.body if isinstance(n, ast.ClassDef) and n.name == 'MainWindow')
          methods = {n.name: n for n in main.body if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef))}

          seeds = {
              '_candidate_weight_files',
              '_model_scan_roots',
              '_scan_3d_model_config',
              '_is_3d_structure_model_configured',
              '_is_3d_hand_model_configured',
              'refresh_3d_model_status',
          }
          missing = sorted(seeds - methods.keys())
          assert not missing, f'missing seed methods: {missing}'

          relevant_name = re.compile(r'(model|weight|scan|candidate|configured)', re.I)
          selected = set(seeds)
          changed = True
          while changed:
              changed = False
              for name in list(selected):
                  node = methods[name]
                  for sub in ast.walk(node):
                      if not isinstance(sub, ast.Call):
                          continue
                      fn = sub.func
                      if not (isinstance(fn, ast.Attribute) and isinstance(fn.value, ast.Name) and fn.value.id == 'self'):
                          continue
                      dep = fn.attr
                      if dep in methods and dep not in selected and relevant_name.search(dep):
                          selected.add(dep)
                          changed = True

          forbidden = [n for n in selected if re.search(r'(export|preview|worker|thread|cache|load_video|segmentation)', n, re.I)]
          assert not forbidden, f'unsafe model closure: {sorted(forbidden)}'
          print('selected model configuration methods:', sorted(selected))

          moved_nodes = [n for n in main.body if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef)) and n.name in selected]
          assert len(moved_nodes) == len(selected)
          lines = source.splitlines(keepends=True)
          node_start = lambda n: min([n.lineno] + [d.lineno for d in n.decorator_list]) - 1
          moved_src = {}
          for node in moved_nodes:
              moved_src[node.name] = ''.join(lines[node_start(node):node.end_lineno]).rstrip() + '\n'

          builtin_names = set(dir(__builtins__))
          loaded = set()
          for node in moved_nodes:
              for sub in ast.walk(node):
                  if isinstance(sub, ast.Name) and isinstance(sub.ctx, ast.Load):
                      loaded.add(sub.id)
          top_st = symtable.symtable(source, str(ui_path), 'exec')
          main_st = next(ch for ch in top_st.get_children() if ch.get_name() == 'MainWindow')
          global_names = set()
          for fn_st in main_st.get_children():
              if fn_st.get_name() not in selected:
                  continue
              for ident in fn_st.get_identifiers():
                  sym = fn_st.lookup(ident)
                  if sym.is_global() and ident not in builtin_names:
                      global_names.add(ident)
          global_names &= loaded

          bound_to_node = {}
          for node in tree.body:
              if isinstance(node, ast.Import):
                  for alias in node.names:
                      bound_to_node[alias.asname or alias.name.split('.')[0]] = node
              elif isinstance(node, ast.ImportFrom):
                  for alias in node.names:
                      bound_to_node[alias.asname or alias.name] = node
          missing_globals = sorted(n for n in global_names if n not in bound_to_node)
          assert not missing_globals, f'moved methods depend on UI-local globals: {missing_globals}'

          import_lines = []
          plain = []
          from_groups = {}
          for name in sorted(global_names):
              node = bound_to_node[name]
              if isinstance(node, ast.Import):
                  alias = next(a for a in node.names if (a.asname or a.name.split('.')[0]) == name)
                  plain.append(alias)
              else:
                  key = (node.module, node.level)
                  alias = next(a for a in node.names if (a.asname or a.name) == name)
                  from_groups.setdefault(key, []).append(alias)
          for a in plain:
              import_lines.append('import ' + a.name + (f' as {a.asname}' if a.asname else ''))
          for (module, level), aliases in sorted(from_groups.items(), key=lambda kv: ((kv[0][0] or ''), kv[0][1])):
              prefix = '.' * level + (module or '')
              specs = ', '.join(a.name + (f' as {a.asname}' if a.asname else '') for a in sorted(aliases, key=lambda a: a.asname or a.name))
              import_lines.append(f'from {prefix} import {specs}')

          body = '# -*- coding: utf-8 -*-\nfrom __future__ import annotations\n\n'
          if import_lines:
              body += '\n'.join(import_lines) + '\n\n'
          body += 'class ModelConfigurationMixin:\n'
          for node in moved_nodes:
              body += moved_src[node.name] + '\n'
          out_path.write_text(body.rstrip() + '\n', encoding='utf-8')

          new_lines = lines[:]
          for start, end in sorted(((node_start(n), n.end_lineno) for n in moved_nodes), reverse=True):
              del new_lines[start:end]
          new_source = ''.join(new_lines)
          import_anchor = 'from components.input_validation_mixin import InputValidationMixin\n'
          assert new_source.count(import_anchor) == 1
          new_source = new_source.replace(import_anchor, import_anchor + 'from components.model_configuration_mixin import ModelConfigurationMixin\n')
          old_class = 'class MainWindow(ResourceManagementMixin, FilePathActionsMixin, InputValidationMixin, ProcessingRangeMixin, PreviewFrameMixin, ProjectStateMixin, JobConfigurationMixin, OutputRoutingMixin, QMainWindow):'
          new_class = 'class MainWindow(ResourceManagementMixin, FilePathActionsMixin, InputValidationMixin, ModelConfigurationMixin, ProcessingRangeMixin, PreviewFrameMixin, ProjectStateMixin, JobConfigurationMixin, OutputRoutingMixin, QMainWindow):'
          assert new_source.count(old_class) == 1
          ui_path.write_text(new_source.replace(old_class, new_class), encoding='utf-8')

          new_tree = ast.parse(out_path.read_text(encoding='utf-8'))
          mixin = next(n for n in new_tree.body if isinstance(n, ast.ClassDef) and n.name == 'ModelConfigurationMixin')
          new_methods = {n.name: n for n in mixin.body if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef))}
          for name in selected:
              assert ast.dump(methods[name], include_attributes=False) == ast.dump(new_methods[name], include_attributes=False), f'AST changed for {name}'
          remaining_tree = ast.parse(ui_path.read_text(encoding='utf-8'))
          remaining_main = next(n for n in remaining_tree.body if isinstance(n, ast.ClassDef) and n.name == 'MainWindow')
          remaining_names = {n.name for n in remaining_main.body if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef))}
          assert not (selected & remaining_names), f'methods remain in MainWindow: {sorted(selected & remaining_names)}'
          assert 'depth_fusion_ui' not in out_path.read_text(encoding='utf-8')
          PY
          python -m compileall -q app
      - name: Commit extraction and self-delete
        shell: bash
        run: |
          rm .github/workflows/extract-model-configuration-mixin-temp.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/depth_fusion_ui.py app/components/model_configuration_mixin.py .github/workflows/extract-model-configuration-mixin-temp.yml
          git commit -m "refactor: extract model configuration mixin"
          git push origin HEAD:refactor/extract-model-configuration-mixin-20260906
