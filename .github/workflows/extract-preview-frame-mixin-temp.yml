name: Extract Preview Frame Mixin Temp

on:
  push:
    branches: [refactor/extract-preview-frame-mixin-20260906]

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract preview frame mixin
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import ast
          import builtins
          import symtable
          import textwrap
          from collections import defaultdict
          from pathlib import Path

          ui_path = Path('app/depth_fusion_ui.py')
          out_path = Path('app/components/preview_frame_mixin.py')
          ui = ui_path.read_text(encoding='utf-8')
          tree = ast.parse(ui)
          main = next(n for n in tree.body if isinstance(n, ast.ClassDef) and n.name == 'MainWindow')
          target_order = [
              '_preview_frame_control_pairs',
              '_all_preview_frame_controls',
              'set_preview_frame_range',
              'update_preview_frame_label',
              '_apply_preview_frame_value',
              'on_preview_frame_slider_changed',
              'on_preview_frame_spin_changed',
              'toggle_preview_playback',
              '_advance_preview_playback',
          ]
          targets = set(target_order)
          methods = {n.name: n for n in main.body if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef)) and n.name in targets}
          missing = targets - methods.keys()
          if missing:
              raise SystemExit(f'missing target methods: {sorted(missing)}')
          for name, node in methods.items():
              if any(isinstance(x, ast.Call) and isinstance(x.func, ast.Name) and x.func.id == 'super' for x in ast.walk(node)):
                  raise SystemExit(f'{name} uses super(); refusing mixin extraction')

          lines = ui.splitlines(keepends=True)
          chunks = []
          spans = []
          before_dump = {}
          for name in target_order:
              node = methods[name]
              chunk = ''.join(lines[node.lineno-1:node.end_lineno]).rstrip() + '\n'
              chunks.append(chunk)
              spans.append((node.lineno-1, node.end_lineno))
              before_dump[name] = ast.dump(node, include_attributes=False)

          global_names = set()
          def walk_table(tbl):
              for sym in tbl.get_symbols():
                  if sym.is_global() and sym.is_referenced():
                      global_names.add(sym.get_name())
              for child in tbl.get_children():
                  walk_table(child)
          for chunk in chunks:
              walk_table(symtable.symtable(textwrap.dedent(chunk), '<method>', 'exec'))
          global_names -= set(dir(builtins))

          import_map = {}
          for node in tree.body:
              if isinstance(node, ast.Import):
                  for alias in node.names:
                      import_map[alias.asname or alias.name.split('.')[0]] = ('import', alias.name, alias.asname)
          for node in tree.body:
              if isinstance(node, ast.ImportFrom):
                  for alias in node.names:
                      import_map.setdefault(alias.asname or alias.name, ('from', node.module, alias.name, alias.asname, node.level))
          unresolved = sorted(name for name in global_names if name not in import_map)
          if unresolved:
              raise SystemExit(f'target methods depend on unresolved UI globals: {unresolved}')

          direct_imports = []
          from_imports = defaultdict(list)
          for name in sorted(global_names):
              spec = import_map[name]
              if spec[0] == 'import':
                  _kind, module, alias = spec
                  direct_imports.append(f'import {module}' + (f' as {alias}' if alias else ''))
              else:
                  _kind, module, original, alias, level = spec
                  if module == 'depth_fusion_ui':
                      raise SystemExit(f'reverse dependency to depth_fusion_ui via {name}')
                  key = ('.' * int(level)) + (module or '')
                  from_imports[key].append(original + (f' as {alias}' if alias else ''))

          header = ['# -*- coding: utf-8 -*-', 'from __future__ import annotations', '']
          header.extend(sorted(set(direct_imports)))
          if direct_imports:
              header.append('')
          for module in sorted(from_imports):
              header.append(f"from {module} import {', '.join(sorted(set(from_imports[module])))}")
          header.extend(['', '', 'class PreviewFrameMixin:'])
          module = '\n'.join(header) + '\n'
          for chunk in chunks:
              module += textwrap.indent(textwrap.dedent(chunk), '    ') + '\n'
          ast.parse(module)
          out_path.write_text(module, encoding='utf-8')

          for start, end in sorted(spans, reverse=True):
              del lines[start:end]
          new_ui = ''.join(lines)
          main2 = next(n for n in ast.parse(new_ui).body if isinstance(n, ast.ClassDef) and n.name == 'MainWindow')
          leaked = targets & {n.name for n in main2.body if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef))}
          if leaked:
              raise SystemExit(f'target methods remain in MainWindow: {sorted(leaked)}')

          mix = next(n for n in ast.parse(module).body if isinstance(n, ast.ClassDef) and n.name == 'PreviewFrameMixin')
          moved = {n.name: n for n in mix.body if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef))}
          for name in target_order:
              if name not in moved:
                  raise SystemExit(f'mixin missing {name}')
              if ast.dump(moved[name], include_attributes=False) != before_dump[name]:
                  raise SystemExit(f'AST changed while moving {name}')

          marker = 'from components.processing_range_mixin import ProcessingRangeMixin\n'
          import_line = 'from components.preview_frame_mixin import PreviewFrameMixin\n'
          if marker not in new_ui:
              raise SystemExit('processing range mixin import marker missing')
          new_ui = new_ui.replace(marker, marker + import_line, 1)
          old_decl = 'class MainWindow(ResourceManagementMixin, FilePathActionsMixin, ProcessingRangeMixin, ProjectStateMixin, JobConfigurationMixin, OutputRoutingMixin, QMainWindow):'
          new_decl = 'class MainWindow(ResourceManagementMixin, FilePathActionsMixin, ProcessingRangeMixin, PreviewFrameMixin, ProjectStateMixin, JobConfigurationMixin, OutputRoutingMixin, QMainWindow):'
          if new_ui.count(old_decl) != 1:
              raise SystemExit('unexpected MainWindow declaration')
          new_ui = new_ui.replace(old_decl, new_decl, 1)
          ast.parse(new_ui)
          ui_path.write_text(new_ui, encoding='utf-8')
          print('preview frame mixin extraction: PASS')
          print('minimal globals:', ', '.join(sorted(global_names)))
          PY
          python -m compileall -q app
      - name: Commit extraction and self-delete
        shell: bash
        run: |
          rm .github/workflows/extract-preview-frame-mixin-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/depth_fusion_ui.py app/components/preview_frame_mixin.py .github/workflows/extract-preview-frame-mixin-temp.yml
          git commit -m "refactor: extract preview frame UI mixin"
          git push
