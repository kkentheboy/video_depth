name: Extract Resource Management Mixin Temp

on:
  push:
    branches: [refactor/extract-resource-management-mixin-20260906]

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract resource management mixin
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import ast
          import builtins
          import textwrap
          from pathlib import Path

          ui_path = Path('app/depth_fusion_ui.py')
          out_path = Path('app/components/resource_management_mixin.py')
          source = ui_path.read_text(encoding='utf-8')
          tree = ast.parse(source, filename=str(ui_path))

          mains = [n for n in tree.body if isinstance(n, ast.ClassDef) and n.name == 'MainWindow']
          if len(mains) != 1:
              raise SystemExit(f'expected one MainWindow class, got {len(mains)}')
          main = mains[0]
          targets = ('open_model_manager', 'open_log_dir', 'open_cache_manager')
          methods = {}
          for name in targets:
              found = [n for n in main.body if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef)) and n.name == name]
              if len(found) != 1:
                  raise SystemExit(f'expected one MainWindow.{name}, got {len(found)}')
              methods[name] = found[0]

          # Build import binding map from the original module. Future imports are ignored.
          import_nodes = []
          binding_to_node = {}
          for node in tree.body:
              if isinstance(node, ast.Import):
                  import_nodes.append(node)
                  for alias in node.names:
                      bound = alias.asname or alias.name.split('.')[0]
                      binding_to_node.setdefault(bound, node)
              elif isinstance(node, ast.ImportFrom) and node.module != '__future__':
                  import_nodes.append(node)
                  for alias in node.names:
                      if alias.name == '*':
                          raise SystemExit('star imports are not supported by this extraction')
                      bound = alias.asname or alias.name
                      binding_to_node.setdefault(bound, node)

          builtin_names = set(dir(builtins))
          required_globals = set()
          for name, method in methods.items():
              # Keep inheritance semantics simple: this mixin must not move zero-arg super() calls.
              for call in (x for x in ast.walk(method) if isinstance(x, ast.Call)):
                  if isinstance(call.func, ast.Name) and call.func.id == 'super' and not call.args and not call.keywords:
                      raise SystemExit(f'{name} uses zero-arg super(); refuse mixin extraction')

              loaded, stored, inner_imports = set(), set(), set()
              for x in ast.walk(method):
                  if isinstance(x, ast.Name):
                      (loaded if isinstance(x.ctx, ast.Load) else stored).add(x.id)
                  elif isinstance(x, (ast.FunctionDef, ast.AsyncFunctionDef, ast.Lambda)):
                      if hasattr(x, 'name'):
                          stored.add(x.name)
                      args = x.args
                      stored.update(a.arg for a in args.posonlyargs + args.args + args.kwonlyargs)
                      if args.vararg:
                          stored.add(args.vararg.arg)
                      if args.kwarg:
                          stored.add(args.kwarg.arg)
                  elif isinstance(x, ast.ExceptHandler) and x.name:
                      stored.add(x.name)
                  elif isinstance(x, ast.Import):
                      inner_imports.update((a.asname or a.name.split('.')[0]) for a in x.names)
                  elif isinstance(x, ast.ImportFrom):
                      inner_imports.update((a.asname or a.name) for a in x.names)
              free = loaded - stored - inner_imports - builtin_names
              unresolved = free - set(binding_to_node)
              if unresolved:
                  raise SystemExit(f'{name} has non-import module globals: {sorted(unresolved)}')
              required_globals.update(free)

          # Preserve original import syntax/order, but only keep aliases actually required by moved methods.
          needed_import_lines = []
          for node in import_nodes:
              aliases = []
              for alias in node.names:
                  bound = alias.asname or (alias.name.split('.')[0] if isinstance(node, ast.Import) else alias.name)
                  if bound in required_globals:
                      aliases.append(alias)
              if not aliases:
                  continue
              if isinstance(node, ast.Import):
                  rendered = 'import ' + ', '.join(
                      a.name + (f' as {a.asname}' if a.asname else '') for a in aliases
                  )
              else:
                  dots = '.' * node.level
                  rendered = f'from {dots}{node.module or ""} import ' + ', '.join(
                      a.name + (f' as {a.asname}' if a.asname else '') for a in aliases
                  )
              needed_import_lines.append(rendered)

          lines = source.splitlines(keepends=True)
          method_sources = {}
          spans = []
          for name in targets:
              node = methods[name]
              method_text = ''.join(lines[node.lineno - 1:node.end_lineno])
              method_sources[name] = textwrap.dedent(method_text).rstrip() + '\n'
              spans.append((node.lineno - 1, node.end_lineno))

          mixin_parts = [
              '# -*- coding: utf-8 -*-\n',
              'from __future__ import annotations\n\n',
          ]
          if needed_import_lines:
              mixin_parts.append('\n'.join(needed_import_lines) + '\n\n')
          mixin_parts.append('class ResourceManagementMixin:\n')
          for name in targets:
              mixin_parts.append(textwrap.indent(method_sources[name], '    '))
              mixin_parts.append('\n')
          mixin_source = ''.join(mixin_parts).rstrip() + '\n'
          mixin_tree = ast.parse(mixin_source, filename=str(out_path))
          mixin_classes = [n for n in mixin_tree.body if isinstance(n, ast.ClassDef) and n.name == 'ResourceManagementMixin']
          if len(mixin_classes) != 1:
              raise SystemExit('generated ResourceManagementMixin is invalid')
          moved = {
              n.name: n for n in mixin_classes[0].body
              if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef)) and n.name in targets
          }
          for name in targets:
              if name not in moved:
                  raise SystemExit(f'generated mixin missing {name}')
              if ast.dump(methods[name], include_attributes=False) != ast.dump(moved[name], include_attributes=False):
                  raise SystemExit(f'AST mismatch after moving {name}')

          # Remove methods from MainWindow without touching surrounding code.
          for start, end in sorted(spans, reverse=True):
              del lines[start:end]
          new_ui = ''.join(lines)

          mixin_import = 'from components.resource_management_mixin import ResourceManagementMixin\n'
          if mixin_import in new_ui:
              raise SystemExit('ResourceManagementMixin import already exists unexpectedly')
          marker = 'from components.model_manager import LocalModelManagerDialog\n'
          if new_ui.count(marker) != 1:
              raise SystemExit('model_manager import marker changed')
          new_ui = new_ui.replace(marker, marker + mixin_import, 1)
          old_header = 'class MainWindow(QMainWindow):'
          new_header = 'class MainWindow(ResourceManagementMixin, QMainWindow):'
          if new_ui.count(old_header) != 1:
              raise SystemExit('MainWindow class header changed unexpectedly')
          new_ui = new_ui.replace(old_header, new_header, 1)

          # Final ownership checks.
          parsed_ui = ast.parse(new_ui, filename=str(ui_path))
          main2 = next(n for n in parsed_ui.body if isinstance(n, ast.ClassDef) and n.name == 'MainWindow')
          remaining_methods = {
              n.name for n in main2.body if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef))
          }
          leaked = set(targets) & remaining_methods
          if leaked:
              raise SystemExit(f'resource methods still in MainWindow: {sorted(leaked)}')
          bases = {b.id for b in main2.bases if isinstance(b, ast.Name)}
          if not {'ResourceManagementMixin', 'QMainWindow'}.issubset(bases):
              raise SystemExit('MainWindow mixin inheritance is incomplete')
          for n in mixin_tree.body:
              if isinstance(n, ast.ImportFrom) and n.module == 'depth_fusion_ui':
                  raise SystemExit('resource management mixin must not import depth_fusion_ui')
              if isinstance(n, ast.Import):
                  if any(a.name == 'depth_fusion_ui' for a in n.names):
                      raise SystemExit('resource management mixin must not import depth_fusion_ui')

          out_path.write_text(mixin_source, encoding='utf-8')
          ui_path.write_text(new_ui, encoding='utf-8')
          print('resource management mixin extraction: PASS')
          print('required globals:', sorted(required_globals))
          PY
          python -m compileall -q app
      - name: Commit extraction and self-delete
        shell: bash
        run: |
          rm .github/workflows/extract-resource-management-mixin-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/depth_fusion_ui.py app/components/resource_management_mixin.py .github/workflows/extract-resource-management-mixin-temp.yml
          git commit -m "refactor: extract resource management mixin"
          git push
