name: Extract Structure Workers Temp

on:
  push:
    branches: [refactor/extract-structure-workers-20260906]

permissions:
  contents: write

# One-time refactor job; self-deletes after a successful extraction.
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract structure workers
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import ast
          import builtins
          from pathlib import Path

          workers_path = Path('app/depth_fusion_workers.py')
          ui_path = Path('app/depth_fusion_ui.py')
          out_path = Path('app/structure_workers.py')
          workers = workers_path.read_text(encoding='utf-8')
          ui = ui_path.read_text(encoding='utf-8')
          tree = ast.parse(workers)
          targets = {'StructureCacheWorker', 'ModelPreloadWorker'}
          nodes = {n.name: n for n in tree.body if isinstance(n, ast.ClassDef) and n.name in targets}
          missing = targets - nodes.keys()
          if missing:
              raise SystemExit(f'missing target classes: {sorted(missing)}')

          worker_local_defs = {
              n.name for n in tree.body
              if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)) and n.name not in targets
          }
          loaded = set()
          stored = set()
          imported_inner = set()
          for node in nodes.values():
              for x in ast.walk(node):
                  if isinstance(x, ast.Name):
                      (loaded if isinstance(x.ctx, ast.Load) else stored).add(x.id)
                  elif isinstance(x, (ast.FunctionDef, ast.AsyncFunctionDef)):
                      stored.add(x.name)
                      stored.update(a.arg for a in x.args.args + x.args.kwonlyargs)
                      if x.args.vararg: stored.add(x.args.vararg.arg)
                      if x.args.kwarg: stored.add(x.args.kwarg.arg)
                  elif isinstance(x, ast.ExceptHandler):
                      if x.name:
                          stored.add(x.name)
                  elif isinstance(x, ast.Import):
                      imported_inner.update((a.asname or a.name.split('.')[0]) for a in x.names)
                  elif isinstance(x, ast.ImportFrom):
                      imported_inner.update((a.asname or a.name) for a in x.names)
          hidden = (loaded - stored - imported_inner - set(dir(builtins))) & worker_local_defs
          if hidden:
              raise SystemExit(f'target classes depend on worker-local symbols: {sorted(hidden)}')

          expected_globals = {
              'Path', 'Optional', 'QObject', 'Signal', 'event_log', 'event_exception',
              'json', 'shutil', 'traceback'
          }
          global_deps = loaded - stored - imported_inner - set(dir(builtins))
          unexpected = global_deps - expected_globals
          if unexpected:
              raise SystemExit(f'unexpected global dependencies: {sorted(unexpected)}')

          lines = workers.splitlines(keepends=True)
          chunks = []
          spans = []
          for name in ('StructureCacheWorker', 'ModelPreloadWorker'):
              n = nodes[name]
              chunks.append(''.join(lines[n.lineno-1:n.end_lineno]).rstrip() + '\n')
              spans.append((n.lineno-1, n.end_lineno))
          for start, end in sorted(spans, reverse=True):
              del lines[start:end]
          new_workers = ''.join(lines)

          module = '''# -*- coding: utf-8 -*-\nfrom __future__ import annotations\n\nfrom pathlib import Path\nimport json\nimport shutil\nimport traceback\nfrom typing import Optional\n\nfrom depth_fusion_core import QObject, Signal, event_exception, event_log\n\n\n''' + '\n\n'.join(chunks).rstrip() + '\n'
          ast.parse(module)
          out_path.write_text(module, encoding='utf-8')
          workers_path.write_text(new_workers, encoding='utf-8')

          ui_tree = ast.parse(ui)
          imports = [n for n in ui_tree.body if isinstance(n, ast.ImportFrom) and n.module == 'depth_fusion_workers']
          if len(imports) != 1:
              raise SystemExit(f'expected one depth_fusion_workers import in UI, got {len(imports)}')
          imp = imports[0]
          names = [(a.name, a.asname) for a in imp.names]
          present = {name for name, _ in names}
          if not targets.issubset(present):
              raise SystemExit(f'UI missing target imports: {sorted(targets - present)}')
          remaining = [(name, alias) for name, alias in names if name not in targets]
          rendered = 'from depth_fusion_workers import (\n' + ''.join(
              f'    {name}' + (f' as {alias}' if alias else '') + ',\n' for name, alias in remaining
          ) + ')\nfrom structure_workers import ModelPreloadWorker, StructureCacheWorker\n'
          ui_lines = ui.splitlines(keepends=True)
          ui_lines[imp.lineno-1:imp.end_lineno] = [rendered]
          ui_path.write_text(''.join(ui_lines), encoding='utf-8')

          for path in sorted(Path('app').rglob('*.py')):
              t = ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
              if path.name == 'structure_workers.py':
                  for n in t.body:
                      if isinstance(n, ast.ImportFrom) and n.module == 'depth_fusion_workers':
                          raise SystemExit('structure_workers must not import depth_fusion_workers')
              for n in t.body:
                  if isinstance(n, ast.ImportFrom) and n.module == 'depth_fusion_workers':
                      bad = targets & {a.name for a in n.names}
                      if bad:
                          raise SystemExit(f'{path} still imports moved workers from monolith: {sorted(bad)}')

          ast.parse(workers_path.read_text(encoding='utf-8'))
          ast.parse(ui_path.read_text(encoding='utf-8'))
          print('structure worker extraction: PASS')
          PY
          python -m compileall -q app
      - name: Commit extraction and self-delete
        shell: bash
        run: |
          rm .github/workflows/extract-structure-workers-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/depth_fusion_workers.py app/depth_fusion_ui.py app/structure_workers.py .github/workflows/extract-structure-workers-temp.yml
          git commit -m "refactor: extract structure background workers"
          git push
