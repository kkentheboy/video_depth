name: Move Model Configuration Constants Temp

on:
  push:
    branches: [refactor/extract-model-configuration-mixin-20260906]

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-model-configuration-mixin-20260906
      - name: Move model scan constants into mixin
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          ui_path = Path('app/depth_fusion_ui.py')
          mixin_path = Path('app/components/model_configuration_mixin.py')
          ui = ui_path.read_text(encoding='utf-8')
          mixin = mixin_path.read_text(encoding='utf-8')

          block = '''    _MODEL_WEIGHT_SUFFIXES = {".pkl", ".npz", ".pt", ".pth", ".ckpt", ".safetensors", ".onnx", ".pt2"}\n    _MODEL_SCAN_SKIP_PARTS = {\n        "test", "tests", "testing", "example", "examples", "sample", "samples",\n        "demo", "demos", "docs", "doc", "assets", "h36m", "coco", "lsp", "mpi_inf_3dhp",\n    }\n    _MODEL_SCAN_SKIP_FILENAMES = {\n        "cameras.pkl", "test_h36m.npz", "test_h36m_body3d.npz",\n    }\n\n'''
          assert ui.count(block) == 1, f'expected one model constant block in MainWindow, got {ui.count(block)}'
          assert '_MODEL_WEIGHT_SUFFIXES =' not in mixin
          assert mixin.count('class ModelConfigurationMixin:\n') == 1

          ui = ui.replace(block, '', 1)
          mixin = mixin.replace('class ModelConfigurationMixin:\n', 'class ModelConfigurationMixin:\n' + block, 1)
          ui_path.write_text(ui, encoding='utf-8')
          mixin_path.write_text(mixin, encoding='utf-8')

          def class_assignments(path, cls_name):
              tree = ast.parse(Path(path).read_text(encoding='utf-8'))
              cls = next(n for n in tree.body if isinstance(n, ast.ClassDef) and n.name == cls_name)
              names = set()
              for node in cls.body:
                  if isinstance(node, ast.Assign):
                      for target in node.targets:
                          if isinstance(target, ast.Name):
                              names.add(target.id)
                  elif isinstance(node, ast.AnnAssign) and isinstance(node.target, ast.Name):
                      names.add(node.target.id)
              return names

          expected = {'_MODEL_WEIGHT_SUFFIXES', '_MODEL_SCAN_SKIP_PARTS', '_MODEL_SCAN_SKIP_FILENAMES'}
          ui_names = class_assignments(ui_path, 'MainWindow')
          mixin_names = class_assignments(mixin_path, 'ModelConfigurationMixin')
          assert not (expected & ui_names), f'constants remain in MainWindow: {expected & ui_names}'
          assert expected <= mixin_names, f'constants missing from mixin: {expected - mixin_names}'
          PY
          python -m compileall -q app
      - name: Commit constant move and self-delete
        shell: bash
        run: |
          rm .github/workflows/move-model-configuration-constants-temp.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/depth_fusion_ui.py app/components/model_configuration_mixin.py .github/workflows/move-model-configuration-constants-temp.yml
          git commit -m "refactor: move model configuration constants"
          git push origin HEAD:refactor/extract-model-configuration-mixin-20260906
