name: Normalize Deployment Environment Imports Temp

on:
  push:
    branches: [refactor/extract-deployment-environment-mixin-20260906]

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-deployment-environment-mixin-20260906
      - name: Normalize stdlib imports
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/components/deployment_environment_mixin.py')
          text = path.read_text(encoding='utf-8')
          old = 'from depth_fusion_core import PROJECT_DIR, QApplication, QTimer, importlib, short_error_message, shutil, structure_cache_root, sys\n'
          new = 'import importlib\nimport shutil\nimport sys\n\nfrom depth_fusion_core import PROJECT_DIR, QApplication, QTimer, short_error_message, structure_cache_root\n'
          assert text.count(old) == 1
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python -m compileall -q app/components/deployment_environment_mixin.py app/depth_fusion_ui.py
      - name: Commit normalization and self-delete
        shell: bash
        run: |
          rm .github/workflows/normalize-deployment-environment-imports-temp.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/components/deployment_environment_mixin.py .github/workflows/normalize-deployment-environment-imports-temp.yml
          git commit -m "refactor: normalize deployment environment imports"
          git push origin HEAD:refactor/extract-deployment-environment-mixin-20260906
