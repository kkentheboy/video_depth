name: Remove Dead Frame Fallback Temp

on:
  push:
    branches: [cleanup/remove-dead-frame-fallback-20260905]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/remove-dead-frame-fallback-20260905
          fetch-depth: 0

      - name: Remove unreachable read_video_frame_bgr fallback
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import ast
          from pathlib import Path

          path = Path('app/depth_fusion_workers.py')
          source = path.read_text(encoding='utf-8')
          tree = ast.parse(source)

          core_imports = set()
          for node in tree.body:
              if isinstance(node, ast.ImportFrom) and node.module == 'depth_fusion_core':
                  core_imports.update(alias.name for alias in node.names)
          if 'read_video_frame_bgr' not in core_imports:
              raise SystemExit('read_video_frame_bgr is not a required depth_fusion_core import; fallback is not proven dead')

          matches: list[ast.Try] = []
          for node in tree.body:
              if not isinstance(node, ast.Try) or not node.body:
                  continue
              first = node.body[0]
              if not (
                  isinstance(first, ast.Expr)
                  and isinstance(first.value, ast.Name)
                  and first.value.id == 'read_video_frame_bgr'
              ):
                  continue
              has_fallback = False
              for handler in node.handlers:
                  handler_name = handler.type.id if isinstance(handler.type, ast.Name) else ''
                  if handler_name != 'NameError':
                      continue
                  if any(isinstance(item, ast.FunctionDef) and item.name == 'read_video_frame_bgr' for item in handler.body):
                      has_fallback = True
              if has_fallback:
                  matches.append(node)

          if len(matches) != 1:
              raise SystemExit(f'expected exactly one unreachable read_video_frame_bgr fallback, found {len(matches)}')

          node = matches[0]
          if node.end_lineno is None:
              raise SystemExit('AST end_lineno unavailable for dead fallback')
          lines = source.splitlines(keepends=True)
          del lines[node.lineno - 1:node.end_lineno]
          path.write_text(''.join(lines), encoding='utf-8')
          PY

          python -m compileall -q app

          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path('app/depth_fusion_workers.py')
          tree = ast.parse(path.read_text(encoding='utf-8'))
          core_imports = set()
          top_defs = set()
          for node in tree.body:
              if isinstance(node, ast.ImportFrom) and node.module == 'depth_fusion_core':
                  core_imports.update(alias.name for alias in node.names)
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
                  top_defs.add(node.name)
          if 'read_video_frame_bgr' not in core_imports:
              raise SystemExit('core read_video_frame_bgr import disappeared')
          if 'read_video_frame_bgr' in top_defs:
              raise SystemExit('local read_video_frame_bgr fallback still exists')
          for node in tree.body:
              if isinstance(node, ast.Try):
                  text = ast.get_source_segment(path.read_text(encoding='utf-8'), node) or ''
                  if 'read_video_frame_bgr' in text and 'NameError' in text:
                      raise SystemExit('read_video_frame_bgr NameError compatibility try still exists')
          print('video_depth dead frame fallback cleanup: PASS')
          PY

      - name: Commit cleanup and self-delete
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/remove-dead-frame-fallback-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/depth_fusion_workers.py .github/workflows/remove-dead-frame-fallback-temp.yml
          git commit -m 'chore: remove unreachable frame read fallback'
          git push origin HEAD:cleanup/remove-dead-frame-fallback-20260905
