name: Source Core Gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  source-core-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile application sources
        run: python -m compileall -q app scripts/regression_source_core_contract.py scripts/regression_encoder_display_contract.py scripts/regression_ui_primitive_authority.py scripts/regression_model_manager_authority.py scripts/regression_frame_reader_authority.py scripts/regression_preview_worker_authority.py scripts/regression_structure_worker_authority.py scripts/regression_resource_management_mixin.py scripts/regression_file_path_actions_mixin.py scripts/regression_project_state_mixin.py scripts/regression_output_routing_mixin.py scripts/regression_job_configuration_mixin.py scripts/regression_processing_range_mixin.py

      - name: Verify core import and cache authority contracts
        run: python scripts/regression_source_core_contract.py

      - name: Verify encoder display extraction contract
        run: python scripts/regression_encoder_display_contract.py

      - name: Verify UI primitive ownership contract
        run: python scripts/regression_ui_primitive_authority.py

      - name: Verify model manager ownership contract
        run: python scripts/regression_model_manager_authority.py

      - name: Verify frame reader ownership contract
        run: python scripts/regression_frame_reader_authority.py

      - name: Verify preview worker ownership contract
        run: python scripts/regression_preview_worker_authority.py

      - name: Verify structure worker ownership contract
        run: python scripts/regression_structure_worker_authority.py

      - name: Verify resource management mixin contract
        run: python scripts/regression_resource_management_mixin.py

      - name: Verify file path actions mixin contract
        run: python scripts/regression_file_path_actions_mixin.py

      - name: Verify project state mixin contract
        run: python scripts/regression_project_state_mixin.py

      - name: Verify output routing mixin contract
        run: python scripts/regression_output_routing_mixin.py

      - name: Verify job configuration mixin contract
        run: python scripts/regression_job_configuration_mixin.py

      - name: Verify processing range mixin contract
        run: python scripts/regression_processing_range_mixin.py
