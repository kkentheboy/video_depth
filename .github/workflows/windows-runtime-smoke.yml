name: Windows Runtime Smoke

on:
  pull_request:
  push:
    branches: [main]

jobs:
  windows-ui-runtime:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install declared dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Construct and close MainWindow offscreen
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/smoke_windows_ui_runtime.py
